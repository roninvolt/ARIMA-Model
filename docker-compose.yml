version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forecastai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/forecast_ai.db:/app/forecast_ai.db
      - ./backend/uploads:/app/uploads
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forecastai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
